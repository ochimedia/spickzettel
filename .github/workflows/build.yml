# Builds and tests the debug and release presets on a hosted Windows
# runner, and keeps the release exe and its PDB as an artifact of the
# run. See "Continuous integration" in docs/ARCHITECTURE.md.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The whole history and its tags: the version stamp is
      # `git describe --tags`, which a shallow clone cannot answer.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # What scripts/clean_build.cmd does, kept for the steps after this
      # one: find Visual Studio, load vcvars64, and hand its environment
      # on. That puts Visual Studio's own CMake and Ninja first on PATH,
      # as on a developer's machine.
      - name: Load the MSVC environment
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR exit /b 1
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
          set >> "%GITHUB_ENV%"

      - name: Show the tools
        run: |
          cl 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          ninja --version
          git describe --tags --always --dirty

      - name: Debug - configure
        run: cmake --preset windows-msvc-debug
      - name: Debug - build
        run: cmake --build --preset windows-msvc-debug
      - name: Debug - test
        run: ctest --preset windows-msvc-debug

      - name: Release - configure
        run: cmake --preset windows-msvc-release
      - name: Release - build
        run: cmake --build --preset windows-msvc-release
      - name: Release - test
        run: ctest --preset windows-msvc-release

      - name: Name the artifact
        id: name
        run: '"version=$(git describe --tags --always --dirty)" >> $env:GITHUB_OUTPUT'

      - uses: actions/upload-artifact@v4
        with:
          name: Spickzettel-${{ steps.name.outputs.version }}
          path: |
            dist/Spickzettel.exe
            dist/symbols/Spickzettel.pdb
          if-no-files-found: error
          retention-days: 30
