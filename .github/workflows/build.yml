# Builds and tests the debug and release presets on a hosted Windows
# runner, and keeps the release exe and its PDB as an artifact of the
# run. Run on a release tag, it also makes a draft GitHub release of
# that build. See "Continuous integration" in docs/ARCHITECTURE.md.
name: Build

# Started by hand, from the Actions tab, for now - see the docs. The
# branch or tag it runs on is picked there.
on:
  workflow_dispatch:

# A newer run on the same branch makes the older one's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # Write, to make the draft release; a run on a branch writes nothing.
    permissions:
      contents: write
    steps:
      # The whole history and its tags: the version stamp is
      # `git describe --tags`, which a shallow clone cannot answer.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Before anything is built: a tag that is not the version in VERSION,
      # or a version the changelog says nothing about, is not a release.
      - name: Check the tag against VERSION and the changelog
        if: github.ref_type == 'tag'
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_name }}" -ne "v$version") {
              throw "The tag ${{ github.ref_name }} is not v$version, the version in VERSION."
          }
          $lines = Get-Content ABOUT.md -Encoding utf8
          $start = [array]::IndexOf($lines, "### $version")
          if ($start -lt 0) {
              throw "ABOUT.md's changelog has no section '### $version'."
          }
          $end = $start + 1
          while ($end -lt $lines.Count -and -not $lines[$end].StartsWith('### ') -and -not $lines[$end].StartsWith('## ')) {
              $end++
          }
          $lines[($start + 1)..($end - 1)] | Set-Content "$env:RUNNER_TEMP\release-notes.md" -Encoding utf8
          "SZ_RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      # What scripts/clean_build.cmd does, kept for the steps after this
      # one: find Visual Studio, load vcvars64, and hand its environment
      # on. That puts Visual Studio's own CMake and Ninja first on PATH,
      # as on a developer's machine.
      - name: Load the MSVC environment
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR exit /b 1
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
          set >> "%GITHUB_ENV%"

      - name: Show the tools
        run: |
          cl 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          ninja --version
          git describe --tags --always --dirty

      - name: Debug - configure
        run: cmake --preset windows-msvc-debug
      - name: Debug - build
        run: cmake --build --preset windows-msvc-debug
      - name: Debug - test
        run: ctest --preset windows-msvc-debug

      - name: Release - configure
        run: cmake --preset windows-msvc-release
      - name: Release - build
        run: cmake --build --preset windows-msvc-release
      - name: Release - test
        run: ctest --preset windows-msvc-release

      - name: Name the artifact
        id: name
        run: '"version=$(git describe --tags --always --dirty)" >> $env:GITHUB_OUTPUT'

      - uses: actions/upload-artifact@v4
        with:
          name: Spickzettel-${{ steps.name.outputs.version }}
          path: |
            dist/Spickzettel.exe
            dist/symbols/Spickzettel.pdb
          if-no-files-found: error
          retention-days: 30

      # A draft, for a person to read over and publish: nothing of it is
      # public until then. The exe as it is, and its PDB zipped and named
      # as symbols, so that nobody takes it for the download; kept with the
      # release because a crash dump from this build is read with it, and
      # an artifact is deleted after 30 days.
      - name: Make a draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $symbols = "$env:RUNNER_TEMP\Spickzettel-$env:SZ_RELEASE_VERSION-symbols.zip"
          Compress-Archive -Path dist\symbols\Spickzettel.pdb -DestinationPath $symbols
          gh release create "${{ github.ref_name }}" --draft --verify-tag `
              --title "Spickzettel $env:SZ_RELEASE_VERSION" `
              --notes-file "$env:RUNNER_TEMP\release-notes.md" `
              dist\Spickzettel.exe $symbols
